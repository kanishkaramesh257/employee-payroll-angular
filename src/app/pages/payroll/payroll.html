<div class="payroll-page">

  <div class="page-header">
    <div>
      <h1>Generate Payroll</h1>
      <p>Generate a salary record for an employee</p>
    </div>
  </div>

  <div class="form-card">

    <div class="form-group">
      <label>Employee</label>

      <select [(ngModel)]="employeeId">
        <option [ngValue]="null">Select Employee</option>

        @for (employee of employees; track employee.employeeId) {
          <option [ngValue]="employee.employeeId">
            {{ employee.employeeName }} (ID: {{ employee.employeeId }})
          </option>
        }
      </select>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Basic Salary</label>
        <input
          type="number"
          [(ngModel)]="basicSalary"
          placeholder="Enter basic salary">
      </div>

      <div class="form-group">
        <label>Allowance</label>
        <input
          type="number"
          [(ngModel)]="allowance"
          placeholder="Enter allowance">
      </div>

      <div class="form-group">
        <label>Deduction</label>
        <input
          type="number"
          [(ngModel)]="deduction"
          placeholder="Enter deduction">
      </div>

    </div>

    <div class="form-actions">
      <button class="generate-button" (click)="generateSalary()">
        Generate Salary
      </button>
    </div>

    @if (message) {
      <div class="success-message">
        {{ message }}
      </div>
    }

    @if (errorMessage) {
      <div class="error-message">
        {{ errorMessage }}
      </div>
    }

  </div>

</div>
